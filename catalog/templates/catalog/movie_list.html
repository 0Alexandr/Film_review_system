{% extends "base.html" %}

{% block title %}Фильмы – КиноОтзыв{% endblock %}

{% block content %}
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
    <h1 class="mb-0">Каталог фильмов</h1>
    <a href="{% url 'catalog:search' %}" class="btn btn-outline-primary">Найти фильм</a>
  </div>
  <p class="text-muted">Всего фильмов: {{ movies|length }}</p>

  <div class="row g-3">
    {% for movie in movies %}
      <div class="col-md-6 col-lg-4">
        {% include "catalog/includes/movie_card.html" %}
      </div>
    {% empty %}
      <p>Фильмы не найдены.</p>
    {% endfor %}
  </div>
{% endblock %}
